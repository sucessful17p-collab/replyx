services:
  relaychat:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - relaychat_data:/srv/relaychat/data
      - relaychat_uploads:/srv/relaychat/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  relaychat_data:
  relaychat_uploads:
